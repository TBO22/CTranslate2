name: T5Gemma CPU throughput investigation

on:
  workflow_dispatch:
    inputs:
      runner_os:
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04]
        default: ubuntu-22.04
      require_intel:
        type: boolean
        default: true
        description: Require Intel for qualification; false permits a labeled backend control
      sample_limit:
        type: choice
        options: ['8', '50']
        default: '8'
        description: Number of examples from the pinned release-gate selection
      backend:
        type: choice
        options: [all, mkl-packed, mkl-unpacked, dnnl]
        default: all
      mode:
        type: choice
        options: [both, natural, fixed, gate-natural, gate-fixed, provenance]
        default: both
      precision:
        type: choice
        options: [both, int8_float32, float32]
        default: both
      operators:
        type: boolean
        default: false
        description: Time projections, attention, softmax, masks and cache-copy operations
      repeats:
        type: choice
        options: ['1', '3', '6']
        default: '3'
      heap_reuse:
        type: choice
        options: ['false', 'true', 'legacy-allocation', 'candidate-ablation']
        default: 'false'
        description: Diagnostic allocator control; legacy-allocation changes no numerical work
      candidate_run:
        type: string
        default: '45992420951'
        description: Actions run containing the candidate Linux wheels in TBO22 or OpenNMT

permissions:
  contents: read
  actions: read

jobs:
  investigate:
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DIAG_REQUIRE_INTEL: ${{ inputs.require_intel }}
      DIAG_SAMPLE_LIMIT: ${{ inputs.sample_limit }}
      DIAG_BACKEND: ${{ inputs.backend }}
      DIAG_MODE: ${{ inputs.mode }}
      DIAG_PRECISION: ${{ inputs.precision }}
      DIAG_OPERATORS: ${{ inputs.operators }}
      DIAG_REPEATS: ${{ inputs.repeats }}
      DIAG_HEAP_REUSE: ${{ inputs.heap_reuse }}
      DIAG_PROVENANCE_ONLY: ${{ inputs.mode == 'provenance' }}
      DIAG_CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Record hardware and enforce qualification requirement
        run: |
          mkdir -p results
          lscpu | tee results/hardware.txt
          if [ "$DIAG_REQUIRE_INTEL" = true ]; then
            grep -q GenuineIntel /proc/cpuinfo || { echo 'An Intel runner is required; rerun this job.'; exit 1; }
            echo 'Intel qualification' > results/qualification.txt
          else
            echo 'Backend control; does not qualify the Intel regression' | tee results/qualification.txt
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v5
        with:
          repository: OpenNMT/CTranslate2
          ref: '40f8e6a1410489dfeeedd8f9133992177be33e9e'
          path: ct2-headers
      - uses: actions/checkout@v5
        with:
          repository: OpenNMT/CTranslate2
          ref: v4.9.1
          path: base-headers
      - name: Verify the read-only StorageView layout
        run: |
          cmp base-headers/include/ctranslate2/storage_view.h ct2-headers/include/ctranslate2/storage_view.h
          cmp base-headers/include/ctranslate2/types.h ct2-headers/include/ctranslate2/types.h
          cmp base-headers/include/ctranslate2/allocator.h ct2-headers/include/ctranslate2/allocator.h
          sha256sum ct2-headers/include/ctranslate2/storage_view.h > results/storage-view-header-sha256.txt
      - name: Download exact candidate wheels from the reported run
        run: |
          if [ "$DIAG_CANDIDATE_RUN" = 45992420951 ]; then source_repo=OpenNMT/CTranslate2; else source_repo=TBO22/CTranslate2; fi
          gh run download "$DIAG_CANDIDATE_RUN" --repo "$source_repo" --name python-wheels-Linux-auto64 --dir wheels
          gh api "repos/$source_repo/actions/runs/$DIAG_CANDIDATE_RUN" > results/candidate-run.json
      - name: Install shared source-model dependencies and isolated CT2 wheels
        run: |
          if [ "$DIAG_PROVENANCE_ONLY" != true ]; then
            python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
            python -m pip install 'transformers==5.24.0' 'datasets==5.1.0' 'sentencepiece==0.2.3'
          fi
          python -m venv --system-site-packages baseline
          python -m venv --system-site-packages candidate
          baseline/bin/python -m pip install 'ctranslate2==4.9.1'
          candidate/bin/python -m pip install wheels/*-cp312-cp312-manylinux*x86_64.whl
          baseline/bin/python -m pip freeze > results/baseline-requirements.txt
          candidate/bin/python -m pip freeze > results/candidate-requirements.txt
          sha256sum wheels/*-cp312-cp312-manylinux*x86_64.whl > results/candidate-wheel-sha256.txt
      - name: Inspect exact native wheel dependencies
        run: python diagnose.py inspect --out "$PWD/results" --baseline-python "$PWD/baseline/bin/python" --candidate-python "$PWD/candidate/bin/python"
      - name: Prepare one shared FP32 model and gate prompts
        if: ${{ inputs.mode != 'provenance' }}
        run: baseline/bin/python diagnose.py prepare --out "$PWD/results" --limit "$DIAG_SAMPLE_LIMIT"
      - name: Build and verify Linux phase hooks
        if: ${{ inputs.mode != 'provenance' }}
        run: python diagnose.py build --out "$PWD/results" --headers "$PWD/ct2-headers" --baseline-python "$PWD/baseline/bin/python" --candidate-python "$PWD/candidate/bin/python"
      - name: Alternate base and PR under requested backends
        if: ${{ inputs.mode != 'provenance' }}
        run: |
          args=(--out "$PWD/results" --baseline-python "$PWD/baseline/bin/python" --candidate-python "$PWD/candidate/bin/python" --length 64 --repeats "$DIAG_REPEATS")
          case "$DIAG_BACKEND" in
            all) ;;
            mkl-packed|mkl-unpacked|dnnl) args+=(--backends "$DIAG_BACKEND") ;;
            *) exit 1 ;;
          esac
          case "$DIAG_MODE" in
            both) ;;
            natural|fixed) args+=(--modes "$DIAG_MODE") ;;
            gate-natural) args+=(--modes natural --fresh-processes) ;;
            gate-fixed) args+=(--modes fixed --fresh-processes) ;;
            *) exit 1 ;;
          esac
          case "$DIAG_PRECISION" in
            both) ;;
            int8_float32|float32) args+=(--compute-types "$DIAG_PRECISION") ;;
            *) exit 1 ;;
          esac
          if [ "$DIAG_OPERATORS" = true ]; then args+=(--operators); fi
          if [ "$DIAG_HEAP_REUSE" = true ]; then args+=(--heap-reuse); fi
          if [ "$DIAG_HEAP_REUSE" = legacy-allocation ]; then args+=(--legacy-allocation); fi
          if [ "$DIAG_HEAP_REUSE" = candidate-ablation ]; then args+=(--candidate-ablation); fi
          python diagnose.py run "${args[@]}" | tee results/measurements.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t5gemma-intel-diagnosis
          retention-days: 7
          path: |
            results/*.json
            results/*.jsonl
            results/*.log
            results/*.txt
